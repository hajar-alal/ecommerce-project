<section class="py-5">
    <div class="container">
  
      <div class="row justify-content-center text-center">
        <div class="col-lg-8 col-xxl-7">
  
          <span class="text-muted">We’re here to help you</span>
  
          <h2 class="display-5 fw-bold mb-3">Get in Touch</h2>
  
          <p class="lead">
            Have a question about your order or need support?
            Our team is always ready to help you with anything you need.
          </p>
  
        </div>
      </div>
  
      <div class="row justify-content-center">
        <div class="col-md-10 col-lg-6 mt-2">
  
          <form (ngSubmit)="onSubmit()" #contactForm="ngForm">
  
            <div class="row">
  
              <!-- Name -->
              <div class="col-md-6">
                <div class="mb-3">
                  <input
                    type="text"
                    class="form-control bg-light"
                    placeholder="Name"
                    name="name"
                    [(ngModel)]="contactData.name"
                    required>
                </div>
              </div>
  
              <!-- Email -->
              <div class="col-md-6">
                <div class="mb-3">
                  <input
                    type="email"
                    class="form-control bg-light"
                    placeholder="Email"
                    name="email"
                    [(ngModel)]="contactData.email"
                    required>
                </div>
              </div>
  
              <!-- Message -->
              <div class="col-md-12">
                <div class="mb-3">
                  <textarea
                    class="form-control bg-light"
                    rows="4"
                    placeholder="Your message"
                    name="message"
                    [(ngModel)]="contactData.message"
                    required>
                  </textarea>
                </div>
              </div>
  
              <!-- Button -->
              <div class="col-md-4">
                <div class="d-grid">
  
                  <button
                    type="submit"
                    class="btn btn-danger"
                    [disabled]="contactForm.invalid">
  
                    Send message
                  </button>
  
                </div>
              </div>
  
            </div>
  
          </form>
  
        </div>
      </div>
  
    </div>
  </section>
